<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nomiv — транспорт Бишкека на карте</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <h1>Nomiv</h1>
    <p class="sub">Маршрутки и автобусы Бишкека</p>
    <input id="search" type="search" placeholder="Поиск: номер или остановка">
    <button id="locate" type="button">Моё местоположение</button>
    <ul id="routes"></ul>
    <p class="note">Данные пока демонстрационные.</p>
  </aside>
  <div id="map"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
